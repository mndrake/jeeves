# Builds Jeeves.app and the M0 spike tools on a GitHub-hosted Apple silicon Mac,
# so nothing has to be compiled locally.
#
# Every push and pull request produces two downloadable artifacts on the run page:
#   Jeeves-macOS-arm64.zip         the menu bar app
#   jeeves-spikes-macOS-arm64.zip  spike-claude, spike-vec, spike-tap, spike-stt, spike-capture,
#                                  spike-asr, spike-kb, spike-qa, and the asr/ and retrieval/
#                                  evaluation files
#
# Publishing a GitHub release (same pattern as mndrake/polly), either:
#   - Actions tab > macOS build > Run workflow > enter a version such as v0.0.1.
#     The workflow creates the tag on the commit it built; no local git needed.
#   - or push a tag: git tag v0.0.1 && git push origin v0.0.1
#
# Signing: ad-hoc by default, so macOS warns on first open (see docs/M0.md,
# "Download a build"). Add the optional secrets below to sign with a Developer ID
# certificate and notarize, which removes the warning.
name: macOS build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]  # not applied to tag pushes
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to create, e.g. v0.0.1. Leave empty to build without releasing."
        required: false
        default: ""

concurrency:
  group: macos-build-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a release build half way.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v') }}
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build app and spike tools
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write  # only used when publishing a release
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v0.0.1 (got '$TAG')"
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; pick a new version"
            exit 1
          fi
          echo "Will publish release $TAG from ${GITHUB_SHA}"

      - name: Select Xcode
        # Newest stable Xcode 27, else newest Xcode 26 (both have the macOS 26 SDK
        # and Swift 6.2+). Set the repository variable XCODE_APP to pin one, for
        # example /Applications/Xcode_26.6.app.
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: |
          if [[ -z "$XCODE_APP" ]]; then
            XCODE_APP=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode_26*.app 2>/dev/null \
              | grep -vi beta | sort -V | tail -1)
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: swift test

      - name: Build spike tools (release, arm64)
        run: |
          swift build -c release --arch arm64
          bin=$(swift build -c release --arch arm64 --show-bin-path)
          mkdir -p dist/jeeves-spikes
          cp "$bin"/spike-claude "$bin"/spike-vec "$bin"/spike-tap "$bin"/spike-stt "$bin"/spike-capture "$bin"/spike-asr "$bin"/spike-kb "$bin"/spike-qa dist/jeeves-spikes/
          cp -R eval/asr dist/jeeves-spikes/asr
          cp -R eval/retrieval dist/jeeves-spikes/retrieval
          cp scripts/mock-anthropic.py dist/jeeves-spikes/
          cp scripts/spikes-README.txt dist/jeeves-spikes/README.txt
          echo "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_RUN_NUMBER}$([[ $RELEASE == true ]] && echo ", release $TAG")" > dist/jeeves-spikes/BUILD.txt

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd App && xcodegen generate

      - name: Build Jeeves.app
        run: |
          mkdir -p build
          version_settings=()
          if [[ "$RELEASE" == true ]]; then version_settings=(MARKETING_VERSION="${TAG#v}"); fi
          xcodebuild build \
            -project App/Jeeves.xcodeproj \
            -scheme Jeeves \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" "${version_settings[@]}" \
            2>&1 | tee build/xcodebuild.log | grep -E 'error:|warning: .*Jeeves|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build/xcodebuild.log || { tail -80 build/xcodebuild.log; exit 1; }
          cp -R build/DerivedData/Build/Products/Release/Jeeves.app dist/

      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/ci-sign-macos.sh dist/Jeeves.app dist/jeeves-spikes App/Jeeves/Jeeves.entitlements

      - name: Package
        # ditto keeps executable bits and code signatures; plain zip does not.
        run: |
          cd dist
          ditto -c -k --keepParent Jeeves.app Jeeves-macOS-arm64.zip
          ditto -c -k --keepParent jeeves-spikes jeeves-spikes-macOS-arm64.zip
          ls -lh *.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: dist/Jeeves-macOS-arm64.zip
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload spike tools
        uses: actions/upload-artifact@v7
        with:
          path: dist/jeeves-spikes-macOS-arm64.zip
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag on GitHub at the built commit when it does not exist yet.
        run: |
          gh release create "$TAG" dist/Jeeves-macOS-arm64.zip dist/jeeves-spikes-macOS-arm64.zip \
            --target "$GITHUB_SHA" \
            --title "Jeeves $TAG" \
            --notes "$(cat <<'EOF'
          Apple silicon build of Jeeves for macOS 26 or later.

          **Install from Terminal** (no security warning, because `curl` does not set the quarantine flag):

          ```bash
          curl -fL -o /tmp/Jeeves.zip https://github.com/mndrake/jeeves/releases/latest/download/Jeeves-macOS-arm64.zip
          rm -rf /Applications/Jeeves.app && ditto -x -k /tmp/Jeeves.zip /Applications
          open /Applications/Jeeves.app
          ```

          Downloaded in a browser instead? This build is ad-hoc signed, not notarized, so clear the quarantine flag once: `xattr -dr com.apple.quarantine /Applications/Jeeves.app`

          `jeeves-spikes-macOS-arm64.zip` holds the M0 spike tools; see docs/M0.md.
          EOF
          )"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
